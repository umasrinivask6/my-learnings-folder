worker_processes  5;
events {
 worker_connections  4096;
}

http {
 server_tokens off;
 server {
       listen              443 ssl;
       server_name         digitalassistant.nayaraenergy.com;
       ssl                 on;
       ssl_certificate     tls.crt;
       ssl_certificate_key tls.key;
       ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
       add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
       add_header X-XSS-Protection "1; mode=block";
	
   location / {
     proxy_pass      http://localhost:4000;
   }
   location /admin {
     proxy_pass      http://localhost:1337;
   }  
   location  /upload {
     proxy_pass   http://localhost:1337;
   }
   location  /api/ {
     rewrite      ^/api/(.*)$ /$1 break;
     proxy_pass   http://localhost:1337/;
   }
   location /v1/chatbot {
     proxy_pass     http://localhost:8101;
   }
   location /chm/ {
     rewrite      ^/chm/(.*)$ /$1 break;
     proxy_read_timeout 86400s;
     proxy_set_header Upgrade $http_upgrade;
     proxy_set_header Connection "upgrade";
     proxy_http_version 1.1;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header Host $host;
     proxy_pass   http://localhost:3030/; 
   }
   #admin portal
   location /portal {
     proxy_pass     http://localhost:8002/;
   }
   location /auth {
     proxy_pass     http://localhost:8002/auth;
   }
   location /nayara {
     proxy_pass     http://localhost:3000/nayara;
   }
   location /user {
     proxy_pass     http://localhost:3000/user
   }
   location /train {
     proxy_pass     http://localhost:3000/train
   }
   location /query {
     proxy_pass     http://localhost:3000/query
   }
   location /project {
     proxy_pass     http://localhost:3000/project
   }
   location /login {
     proxy_pass     http://localhost:3000/login
   }
   location /search {
     proxy_pass     http://localhost:3000/search
   }
   location /addlogs {
     proxy_pass     http://localhost:3000/addlogs
   }
   location /searchrasa {
     proxy_pass     http://localhost:3000/searchrasa
   }
   location /elastic {
     proxy_pass     http://localhost:3000/elastic
   }

 }
}
